[package]
name = "wat-shell"
description = "Window shell for What-A-Browser: desktop and mobile entry points"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# An Android app loads the browser as a shared library, so the crate has to be
# built as one; `lib` stays for the desktop binary and the tests.
[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["window"]
# Windowing can be switched off for headless builds; the CLI still works.
window = ["winit", "softbuffer"]

[dependencies]
wat-css.workspace = true
wat-engine.workspace = true
wat-layout.workspace = true
wat-net.workspace = true
wat-paint.workspace = true
wat-style.workspace = true
wat-text.workspace = true
wat-theme.workspace = true
wat-ui.workspace = true
log.workspace = true
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, optional = true, features = ["android-native-activity"] }
# Without this, `log` output goes nowhere on a device.
android_logger = "0.14"
