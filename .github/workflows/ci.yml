name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # winit needs X11/Wayland development headers on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build
        run: cargo build --workspace --all-targets

      # `--no-fail-fast` so one platform-specific failure does not hide the
      # rest behind it.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The renderer runs headlessly, so a screenshot is a real smoke test.
      - name: Render a page without a display
        run: |
          cargo run --release -- shot about:home --offline -o smoke.png
          cargo run --release -- version

  # The Android build is a different target, not a different codebase, so what
  # this really checks is that the platform-specific paths still compile and
  # that the app still packages.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      # Prefer the NDK already on the runner image; install one only if there is
      # none. Either way the result is checked, so a missing NDK fails here with
      # a clear message instead of somewhere inside cargo-ndk.
      - name: Find an NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ ! -d "$ndk/toolchains" ]; then
            sdkmanager --install "ndk;$NDK_VERSION"
            ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          fi
          test -d "$ndk/toolchains" || { echo "no usable NDK at $ndk" >&2; exit 1; }
          echo "using $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
        env:
          NDK_VERSION: "27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # One ABI is built and packaged all the way to an APK, which is what
      # proves the app still assembles. The other three are only type-checked:
      # linking four debug libraries takes minutes and finds nothing that
      # checking does not, and the release workflow builds them properly.
      - name: Build the APK
        run: ./android/build.sh debug arm64

      # An APK with no library in it installs and then dies on launch, so what
      # is inside is checked rather than assumed.
      - name: Check what is in it
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libwat_shell.so'
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'

      - name: Check the other ABIs compile
        run: |
          for target in armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            cargo ndk -t "$target" --platform 24 check -p wat-shell --lib
          done

  # No NDK and no Rust: this one is quick enough to run on every push, unlike the
  # native Android build above.
  webview:
    name: WebView APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      # The unit tests are the scheme policy, which is a security boundary.
      - name: Test and build
        run: ./android-webview/build.sh release

      # An APK that declares more than it needs is the failure worth catching
      # here: this browser asks for INTERNET and nothing else.
      - name: Check what it asks for
        run: |
          aapt2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          apk=$(find android-webview/app/build/outputs/apk/release -name '*.apk' | head -1)
          permissions=$("$aapt2" dump badging "$apk" | grep "^uses-permission" || true)
          echo "$permissions"
          if [ "$(echo "$permissions" | wc -l)" -ne 1 ] || \
             ! echo "$permissions" | grep -q "android.permission.INTERNET"; then
              echo "the WebView browser should ask for INTERNET and nothing else" >&2
              exit 1
          fi
          # Cleartext must stay off; a browser that loads http:// silently is the
          # thing this app is meant not to be.
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" \
              | grep -q "usesCleartextTraffic(0x010104ec)=false"

          # Private windows are private *because* they run in their own process:
          # Android's WebView keeps one cookie jar per process. Drop the process
          # attribute and the window still says "Hiding cat" while sharing the
          # ordinary window's cookies, which is the kind of regression nobody
          # notices by using the app.
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          for process in ':cat' ':lion'; do
              echo "$manifest" | grep -q "process(0x01010011)=\"$process\"" || {
                  echo "the private window for $process must have a process of its own" >&2
                  exit 1
              }
          done

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
