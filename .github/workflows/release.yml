name: Release

# Tagging `v0.1.0` builds the Android app on WAT's own engine and publishes the
# APK. The workflow can also be started by hand to check the build still works
# without publishing anything.
#
# There is no desktop matrix any more: the PC browser is a Firefox fork in
# `firefox/`, which cannot be built on a hosted runner. The everyday Android
# browser on the system WebView has its own workflow, `android-release.yml`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as, or blank for a dry run"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A release binary is what people download, so it is worth the extra link time.
  CARGO_PROFILE_RELEASE_LTO: "true"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # Nothing is published unless the whole workspace is green, so a bad tag
  # cannot become a release.
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      # The runner image usually ships an NDK already; using it saves a slow
      # download. Installing one is the fallback, not the default, and the
      # result is checked either way so a missing NDK fails here rather than
      # inside cargo-ndk.
      - name: Find an NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ ! -d "$ndk/toolchains" ]; then
            sdkmanager --install "ndk;$NDK_VERSION"
            ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          fi
          test -d "$ndk/toolchains" || { echo "no usable NDK at $ndk" >&2; exit 1; }
          echo "using $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
        env:
          NDK_VERSION: "27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the APK
        run: ./android/build.sh release

      - name: Name it after the version
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
            version="${version:-dev}"
            version="${version#v}"
          fi
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk"
          # Unsigned: the signing key is not something to keep in a repository.
          asset="wat-$version-android-unsigned.apk"
          cp "$apk" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Check what is in it
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "${{ steps.package.outputs.asset }}" | grep -q "lib/$abi/libwat_shell.so"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [android]
    runs-on: ubuntu-latest
    # A manual run builds and checks everything but publishes nothing unless a
    # tag was named for it.
    if: github.event_name == 'push' || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -l

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: WAT ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **What-A-Browser** — an independent browser engine written from
            scratch in Rust. Not Chromium, not Gecko, not WebKit.

            This release is the Android app built on WAT's own engine: no
            WebView, no Java beyond a manifest, everything from the HTML parser
            to the rasterizer is the Rust in `crates/`. It carries all four ABIs.

            The `.apk` is unsigned, so `adb install` it or sign it yourself —
            see `docs/ANDROID.md`. Verify a download against `SHA256SUMS`.

            For the everyday browser on Android's system WebView, with tabs,
            private windows and Tor, see the `Android-v*` releases.

            There is no desktop build: the PC browser now lives in `firefox/` as
            a Firefox fork, and it is scaffolding rather than a shipped binary.
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS
